name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'test-d/**'
      - 'test-utils/**'
      - 'tooling/**'
      - 'benches/**'
      - 'src/**'
      - 'tests/**'
      - '*.json'
      - '*.ts'
      - '*.js'
      - '*.mjs'
      - 'docs/**'
      - 'scripts/**'
      - 'examples/**'
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.npmignore'
      - '.npmrc'
      - '.prettierignore'
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'test-d/**'
      - 'test-utils/**'
      - 'tooling/**'
      - 'benches/**'
      - 'src/**'
      - 'tests/**'
      - '*.json'
      - '*.ts'
      - '*.js'
      - '*.mjs'
      - 'docs/**'
      - 'scripts/**'
      - 'examples/**'
      - '**.md'
      - '.gitattributes'
      - '.gitignore'
      - '.npmignore'
      - '.npmrc'
      - '.prettierignore'

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package metadata lint
        run: npm run test:publint

      - name: Benchmark contract
        run: npm run test:bench-contract

      - name: Checks tests
        run: npm run test:checks

      - name: Public type contracts
        run: npm run test:types

      - name: Unit tests
        run: npm run test:unit

      - name: jsdom tests
        run: npm run test:jsdom

      - name: Packed consumer contract
        run: npm run test:package

      - name: Setup Node 18 consumer runtime
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Node 18 packed consumer contract
        run: node ./scripts/test-package-consumer.mjs

  browser:
    name: Browser Integration (Chromium)
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser integration tests
        run: npm run test:browser
