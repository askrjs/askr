name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/packages/**'
      - '.claude/**'
      - '.vscode/**'
      - 'README.md'
      - 'MONOREPO_MIGRATION.md'
      - 'docs/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/packages/**'
      - '.claude/**'
      - '.vscode/**'
      - 'README.md'
      - 'MONOREPO_MIGRATION.md'
      - 'docs/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Monorepo
        run: npm run verify:monorepo

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
