name: CI

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '15 3 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package metadata lint
        run: npm run test:publint

      - name: Checks tests
        run: npm run test:checks

      - name: Public type contracts
        run: npm run test:types

      - name: Unit tests
        run: npm run test:unit

      - name: jsdom tests
        run: npm run test:jsdom

  browser:
    name: Browser Integration (Chromium)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Browser integration tests
        run: npm run test:browser
