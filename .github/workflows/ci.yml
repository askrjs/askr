name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'checks/**'
      - 'benches/**'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'checks/**'
      - 'benches/**'
      - 'vitest.config.ts'

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Docs checks
        run: npm run test:docs

      - name: Example checks
        run: npm run test:examples
