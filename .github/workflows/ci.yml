name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: jsdom tests
        run: npm run test:jsdom

      - name: Install Playwright browsers
        run: npm run test:browser:install

      - name: Browser tests
        run: npm run test:browser

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Cross-browser smoke tests
        run: npm run test:browser:smoke

      - name: Benchmark stability
        run: npm run bench:verify
