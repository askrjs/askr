name: Benchmarks

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare benchmark capture output
        run: |
          rm -rf bench-results
          mkdir -p bench-results

      - name: Run tier1 benchmark lane
        run: npm run bench:tier1 -- --outputJson bench-results/tier1.json

      - name: Run tier2 benchmark lane
        run: npm run bench:tier2 -- --outputJson bench-results/tier2.json

      - name: Run tier3 benchmark lane
        run: npm run bench:tier3 -- --outputJson bench-results/tier3.json

      - name: Run tier4 benchmark lane
        run: npm run bench:tier4 -- --outputJson bench-results/tier4.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bench-results-stable
          path: bench-results/
