name: Benchmarks
run-name: "Benchmarks (${{ inputs.tier || 'all' }}): ${{ inputs.pattern || 'all workloads' }}"

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional baseline commit for same-runner comparisons
        required: false
        type: string

      control:
        description: Repeat the baseline before each candidate to measure capture variation
        required: false
        type: boolean
        default: false
      harness:
        description: Optional shared benchmark harness commit for baseline recaptures
        required: false
        type: string
      tier:
        description: Tier to capture
        required: false
        type: choice
        default: all
        options: [all, '1', '2', '3', '4']
      pattern:
        description: Optional unchanged workload name pattern for isolated recaptures
        required: false
        type: string
      file:
        description: Optional repository-relative benchmark filename for recaptures
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_PATTERN: ${{ inputs.pattern || '.*' }}
      BENCH_FILE: ${{ inputs.file || '.' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare benchmark capture output
        run: |
          rm -rf bench-results
          mkdir -p bench-results
          node --version > bench-results/provenance.txt
          npm --version >> bench-results/provenance.txt
          git rev-parse HEAD >> bench-results/provenance.txt
          git diff --quiet && printf '%s\n' 'dirty=false' >> bench-results/provenance.txt || printf '%s\n' 'dirty=true' >> bench-results/provenance.txt
          uname -a >> bench-results/provenance.txt
          lscpu >> bench-results/provenance.txt
          npm ls playwright --depth=0 >> bench-results/provenance.txt
          sha256sum package-lock.json >> bench-results/provenance.txt
          printf '%s\n' "runner_image=${ImageOS:-unknown}" >> bench-results/provenance.txt
          printf '%s\n' "runner_image_version=${ImageVersion:-unknown}" >> bench-results/provenance.txt
          printf '%s\n' 'instrumentation=disabled' >> bench-results/provenance.txt
          printf '%s\n' "file_filter=$BENCH_FILE" >> bench-results/provenance.txt

      - name: Verify the candidate uses the shared benchmark harness
        if: inputs.harness != ''
        env:
          BENCH_HARNESS_REF: ${{ inputs.harness }}
        run: |
          git fetch --depth=1 origin "$BENCH_HARNESS_REF"
          git diff --exit-code FETCH_HEAD -- benches
          git rev-parse FETCH_HEAD > bench-results/candidate-harness-provenance.txt

      - name: Checkout comparison baseline
        if: inputs.baseline != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: .benchmark-baseline

      - name: Install baseline dependencies
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: npm ci

      - name: Use the shared benchmark harness for the baseline
        if: inputs.baseline != '' && inputs.harness != ''
        working-directory: .benchmark-baseline
        env:
          BENCH_HARNESS_REF: ${{ inputs.harness }}
        run: |
          git fetch --depth=1 origin "$BENCH_HARNESS_REF"
          git rev-parse FETCH_HEAD > ../bench-results/harness-provenance.txt
          git restore --source=FETCH_HEAD -- benches
          git diff -- benches > ../bench-results/baseline-harness.diff

      - name: Record baseline provenance
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: |
          git rev-parse HEAD > ../bench-results/baseline-provenance.txt
          sha256sum package-lock.json >> ../bench-results/baseline-provenance.txt

      - name: Run baseline tier1 capture 1
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- "./$BENCH_FILE" --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier1-run1.json

      - name: Run baseline control tier1 capture 1
        if: inputs.baseline != '' && inputs.control && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- "./$BENCH_FILE" --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/control-tier1-run1.json

      - name: Run tier1 capture 1
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        run: npm run bench:tier1 -- "./$BENCH_FILE" --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier1-run1.json

      - name: Run baseline tier1 capture 2
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- "./$BENCH_FILE" --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier1-run2.json

