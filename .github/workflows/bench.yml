name: Benchmarks
run-name: "Benchmarks (${{ inputs.tier || 'all' }}): ${{ inputs.pattern || 'all workloads' }}"

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional baseline commit for same-runner comparisons
        required: false
        type: string
      control:
        description: Repeat the baseline before each candidate to measure capture variation
        required: false
        type: boolean
        default: false
      harness:
        description: Optional shared benchmark harness commit for baseline recaptures
        required: false
        type: string
      tier:
        description: Tier to capture
        required: false
        type: choice
        default: all
        options: [all, '1', '2']
      pattern:
        description: Optional unchanged workload name pattern for isolated recaptures
        required: false
        type: string
      file:
        description: Optional repository-relative benchmark filename for recaptures
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks tier${{ matrix.tier }} (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs have no inputs and capture every tier.
        tier: ${{ fromJSON((inputs.tier == '' || inputs.tier == 'all') && '["1","2"]' || format('["{0}"]', inputs.tier)) }}
    env:
      TIER: ${{ matrix.tier }}
      BASELINE: ${{ inputs.baseline }}
      CONTROL: ${{ inputs.control }}
      BENCH_PATTERN: ${{ inputs.pattern || '.*' }}
      BENCH_FILE: ${{ inputs.file || '.' }}
      BENCH_HARNESS_PATHS: benches vitest.bench.shared.ts vitest.bench.tier1.config.ts vitest.bench.tier2.config.ts tooling/askr-tooling.ts tests/setup-bench-env.ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 'lts/*'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Record provenance
        run: |
          rm -rf bench-results
          mkdir -p bench-results
          {
            node --version
            npm --version
            git rev-parse HEAD
            git diff --quiet && echo 'dirty=false' || echo 'dirty=true'
            uname -a
            lscpu
            sha256sum package-lock.json
            echo "runner_image=${ImageOS:-unknown}"
            echo "runner_image_version=${ImageVersion:-unknown}"
            echo 'instrumentation=disabled'
            echo "tier=$TIER"
            echo "file_filter=$BENCH_FILE"
          } > bench-results/provenance.txt

      - name: Verify the candidate uses the shared benchmark harness
        if: inputs.harness != ''
        env:
          BENCH_HARNESS_REF: ${{ inputs.harness }}
        run: |
          git fetch --depth=1 origin "$BENCH_HARNESS_REF"
          git diff --exit-code FETCH_HEAD -- $BENCH_HARNESS_PATHS
          git rev-parse FETCH_HEAD > bench-results/candidate-harness-provenance.txt

      - name: Checkout comparison baseline
        if: inputs.baseline != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: .benchmark-baseline

      - name: Install baseline dependencies
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: npm ci

      - name: Use the shared benchmark harness for the baseline
        if: inputs.baseline != '' && inputs.harness != ''
        working-directory: .benchmark-baseline
        env:
          BENCH_HARNESS_REF: ${{ inputs.harness }}
        run: |
          git fetch --depth=1 origin "$BENCH_HARNESS_REF"
          git rev-parse FETCH_HEAD > ../bench-results/harness-provenance.txt
          git restore --source=FETCH_HEAD -- $BENCH_HARNESS_PATHS
          git diff -- $BENCH_HARNESS_PATHS > ../bench-results/baseline-harness.diff

      - name: Record baseline provenance
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: |
          git rev-parse HEAD > ../bench-results/baseline-provenance.txt
          sha256sum package-lock.json >> ../bench-results/baseline-provenance.txt

      # Three sequential captures on this runner. With a baseline, each
      # candidate capture runs immediately after its baseline (and control).
      - name: Capture tier${{ matrix.tier }}
        run: |
          capture() {
            (cd "$1" && npm run "bench:tier$TIER" -- "./$BENCH_FILE" --testNamePattern "$BENCH_PATTERN" --outputJson "$GITHUB_WORKSPACE/bench-results/$2-run$run.json")
          }
          for run in 1 2 3; do
            if [ -n "$BASELINE" ]; then
              capture .benchmark-baseline "baseline-tier$TIER"
              if [ "$CONTROL" = true ]; then
                capture .benchmark-baseline "control-tier$TIER"
              fi
            fi
            capture . "tier$TIER"
          done

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-stable-tier${{ matrix.tier }}
          path: bench-results/
