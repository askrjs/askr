name: Benchmarks

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare benchmark capture output
        run: |
          rm -rf bench-results
          mkdir -p bench-results
          node --version > bench-results/provenance.txt
          npm --version >> bench-results/provenance.txt
          git rev-parse HEAD >> bench-results/provenance.txt
          git diff --quiet && printf '%s\n' 'dirty=false' >> bench-results/provenance.txt || printf '%s\n' 'dirty=true' >> bench-results/provenance.txt
          uname -a >> bench-results/provenance.txt
          npm ls playwright --depth=0 >> bench-results/provenance.txt
          sha256sum package-lock.json >> bench-results/provenance.txt
          printf '%s\n' "runner_image=${ImageOS:-unknown}" >> bench-results/provenance.txt
          printf '%s\n' 'instrumentation=disabled' >> bench-results/provenance.txt

      - name: Run tier1 capture 1
        run: npm run bench:tier1 -- --outputJson bench-results/tier1-run1.json

      - name: Run tier1 capture 2
        run: npm run bench:tier1 -- --outputJson bench-results/tier1-run2.json

      - name: Run tier1 capture 3
        run: npm run bench:tier1 -- --outputJson bench-results/tier1-run3.json

      - name: Run tier2 capture 1
        run: npm run bench:tier2 -- --outputJson bench-results/tier2-run1.json

      - name: Run tier2 capture 2
        run: npm run bench:tier2 -- --outputJson bench-results/tier2-run2.json

      - name: Run tier2 capture 3
        run: npm run bench:tier2 -- --outputJson bench-results/tier2-run3.json

      - name: Run tier3 capture 1
        run: npm run bench:tier3 -- --outputJson bench-results/tier3-run1.json

      - name: Run tier3 capture 2
        run: npm run bench:tier3 -- --outputJson bench-results/tier3-run2.json

      - name: Run tier3 capture 3
        run: npm run bench:tier3 -- --outputJson bench-results/tier3-run3.json

      - name: Run tier4 capture 1
        run: npm run bench:tier4 -- --outputJson bench-results/tier4-run1.json

      - name: Run tier4 capture 2
        run: npm run bench:tier4 -- --outputJson bench-results/tier4-run2.json

      - name: Run tier4 capture 3
        run: npm run bench:tier4 -- --outputJson bench-results/tier4-run3.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bench-results-stable
          path: bench-results/
