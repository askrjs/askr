name: Benchmarks
run-name: "Benchmarks (${{ inputs.tier || 'all' }}): ${{ inputs.pattern || 'all workloads' }}"

on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional baseline commit for same-runner comparisons
        required: false
        type: string

      tier:
        description: Tier to capture
        required: false
        type: choice
        default: all
        options: [all, '1', '2', '3', '4']
      pattern:
        description: Optional unchanged workload name pattern for isolated recaptures
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BENCH_PATTERN: ${{ inputs.pattern || '.*' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare benchmark capture output
        run: |
          rm -rf bench-results
          mkdir -p bench-results
          node --version > bench-results/provenance.txt
          npm --version >> bench-results/provenance.txt
          git rev-parse HEAD >> bench-results/provenance.txt
          git diff --quiet && printf '%s\n' 'dirty=false' >> bench-results/provenance.txt || printf '%s\n' 'dirty=true' >> bench-results/provenance.txt
          uname -a >> bench-results/provenance.txt
          npm ls playwright --depth=0 >> bench-results/provenance.txt
          sha256sum package-lock.json >> bench-results/provenance.txt
          printf '%s\n' "runner_image=${ImageOS:-unknown}" >> bench-results/provenance.txt
          printf '%s\n' 'instrumentation=disabled' >> bench-results/provenance.txt

      - name: Checkout comparison baseline
        if: inputs.baseline != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: .benchmark-baseline

      - name: Install baseline dependencies
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: npm ci

      - name: Record baseline provenance
        if: inputs.baseline != ''
        working-directory: .benchmark-baseline
        run: |
          git rev-parse HEAD > ../bench-results/baseline-provenance.txt
          sha256sum package-lock.json >> ../bench-results/baseline-provenance.txt

      - name: Run baseline tier1 capture 1
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier1-run1.json

      - name: Run tier1 capture 1
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier1-run1.json

      - name: Run baseline tier1 capture 2
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier1-run2.json

      - name: Run tier1 capture 2
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier1-run2.json

      - name: Run baseline tier1 capture 3
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        working-directory: .benchmark-baseline
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier1-run3.json

      - name: Run tier1 capture 3
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '1')
        run: npm run bench:tier1 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier1-run3.json

      - name: Run baseline tier2 capture 1
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        working-directory: .benchmark-baseline
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier2-run1.json

      - name: Run tier2 capture 1
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier2-run1.json

      - name: Run baseline tier2 capture 2
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        working-directory: .benchmark-baseline
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier2-run2.json

      - name: Run tier2 capture 2
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier2-run2.json

      - name: Run baseline tier2 capture 3
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        working-directory: .benchmark-baseline
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier2-run3.json

      - name: Run tier2 capture 3
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '2')
        run: npm run bench:tier2 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier2-run3.json

      - name: Run baseline tier3 capture 1
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        working-directory: .benchmark-baseline
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier3-run1.json

      - name: Run tier3 capture 1
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier3-run1.json

      - name: Run baseline tier3 capture 2
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        working-directory: .benchmark-baseline
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier3-run2.json

      - name: Run tier3 capture 2
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier3-run2.json

      - name: Run baseline tier3 capture 3
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        working-directory: .benchmark-baseline
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier3-run3.json

      - name: Run tier3 capture 3
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '3')
        run: npm run bench:tier3 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier3-run3.json

      - name: Run baseline tier4 capture 1
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        working-directory: .benchmark-baseline
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier4-run1.json

      - name: Run tier4 capture 1
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier4-run1.json

      - name: Run baseline tier4 capture 2
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        working-directory: .benchmark-baseline
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier4-run2.json

      - name: Run tier4 capture 2
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier4-run2.json

      - name: Run baseline tier4 capture 3
        if: inputs.baseline != '' && (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        working-directory: .benchmark-baseline
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson ../bench-results/baseline-tier4-run3.json

      - name: Run tier4 capture 3
        if: (inputs.tier == '' || inputs.tier == 'all' || inputs.tier == '4')
        run: npm run bench:tier4 -- --testNamePattern "$BENCH_PATTERN" --outputJson bench-results/tier4-run3.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-stable
          path: bench-results/
