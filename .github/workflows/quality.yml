name: Extended Quality

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequence-and-browser:
    name: ${{ matrix.browser }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: macos-latest
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}
        if: runner.os == 'Linux'

      - run: npx playwright install ${{ matrix.browser }}
        if: runner.os != 'Linux'

      - name: Run replayable lifecycle sequences
        env:
          ASKR_QUALITY_SEEDS: 0..99
        run: npm run test:jsdom -- --testNamePattern="lifecycle sequence"

      - name: Run browser coverage
        env:
          ASKR_BROWSER: ${{ matrix.browser }}
        run: npm run test:browser

      - name: Upload failing seed traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-traces-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
            .askr-quality-traces/
          if-no-files-found: ignore
