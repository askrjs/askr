name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Compute release tag
        id: version
        uses: askrjs/actions/actions/compute-release-tag@cfbfac63066d778fa1fa99247f6af43515155e4f

      - name: Check whether tag exists
        id: tag_status
        uses: askrjs/actions/actions/check-tag-exists@cfbfac63066d778fa1fa99247f6af43515155e4f
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Verify an existing tag points to this verified commit
        if: steps.tag_status.outputs.exists == 'true'
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -n 1 "$tag")" = "${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run release gate
        run: npm run release:verify

      - name: Create release tag
        if: steps.tag_status.outputs.exists != 'true'
        uses: askrjs/actions/actions/create-tag@cfbfac63066d778fa1fa99247f6af43515155e4f
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Checkout release tag
        if: steps.tag_status.outputs.exists != 'true'
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          git checkout "$tag"

      - name: Publish to npm
        run: npm publish --provenance --access public
