name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Resolve npm dist-tag
        id: package
        uses: askrjs/actions/actions/resolve-npm-tag@ed124344f103ec17a3ff86013bcdedf2d87e92c4
        with:
          semver: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        uses: askrjs/actions/actions/publish-package@ed124344f103ec17a3ff86013bcdedf2d87e92c4
        with:
          package-json-path: package.json
          registry: https://registry.npmjs.org/
          access: public
          tag: ${{ steps.package.outputs.tag }}
