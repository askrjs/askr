name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Compute release tag
        id: version
        uses: askrjs/actions/actions/compute-release-tag@342228f45100712f78658dd2ef283f0b1acf2b80

      - name: Check whether tag exists
        id: tag_status
        uses: askrjs/actions/actions/check-tag-exists@342228f45100712f78658dd2ef283f0b1acf2b80
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Verify an existing tag points to this verified commit
        if: steps.tag_status.outputs.exists == 'true'
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -n 1 "$tag")" = "${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run complete release gate before tagging
        run: npm run release:verify

      - name: Create release tag
        if: steps.tag_status.outputs.exists != 'true'
        uses: askrjs/actions/actions/create-tag@342228f45100712f78658dd2ef283f0b1acf2b80
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Checkout created tag
        if: steps.tag_status.outputs.exists != 'true'
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          git checkout "$tag"

      - name: Publish to npm
        uses: askrjs/actions/actions/publish-package@342228f45100712f78658dd2ef283f0b1acf2b80
