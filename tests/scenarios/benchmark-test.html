<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Askr Benchmark Test</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .container {
        margin-bottom: 20px;
      }
      .controls {
        margin-bottom: 20px;
      }
      .controls button {
        margin: 5px;
        padding: 8px 16px;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      tr {
        border-bottom: 1px solid #ddd;
      }
      tr.danger {
        background-color: #ffebee;
      }
      td {
        padding: 8px;
        cursor: pointer;
      }
      .col-md-1 {
        width: 10%;
      }
      .col-md-4 {
        width: 40%;
      }
      .col-md-6 {
        width: 50%;
      }
      a {
        color: #1976d2;
        text-decoration: none;
        cursor: pointer;
      }
      a:hover {
        text-decoration: underline;
      }
      .remove-icon {
        color: #d32f2f;
        font-size: 20px;
        font-weight: bold;
      }
      #status {
        padding: 10px;
        margin: 10px 0;
        background: #e8f5e9;
        border: 1px solid #4caf50;
        border-radius: 4px;
      }
      .error {
        background: #ffebee !important;
        border-color: #f44336 !important;
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <h1>Askr js-framework-benchmark Test</h1>

    <div id="status">Loading Askr...</div>

    <div class="container">
      <div class="controls">
        <button id="run">Create 1,000 rows</button>
        <button id="runlots">Create 10,000 rows</button>
        <button id="add">Append 1,000 rows</button>
        <button id="update">Update every 10th row</button>
        <button id="clear">Clear</button>
        <button id="swaprows">Swap Rows</button>
      </div>
    </div>

    <div id="main"></div>

    <script>
      // Error reporting
      window.addEventListener('error', (e) => {
        const status = document.getElementById('status');
        status.className = 'error';
        status.textContent = `Error: ${e.message}\n${e.filename}:${e.lineno}`;
        console.error('Error:', e);
      });

      // Check if Askr is loaded
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const status = document.getElementById('status');
          const main = document.getElementById('main');

          if (!main.innerHTML) {
            status.className = 'error';
            status.textContent =
              'Error: Askr app not mounted. Check console for errors.';
          } else if (status.className !== 'error') {
            status.textContent = 'Askr loaded successfully! App is running.';
          }
        }, 100);
      });
    </script>

    <!-- 
    Instructions:
    1. Build your Askr app to a bundle (e.g., dist/benchmark.js)
    2. Update the script src below to point to your built bundle
    3. The bundle should contain the benchmark code that calls createIsland
  -->
    <script type="module">
      // Option 1: Import from your built bundle
      // import './dist/benchmark.js';

      // Option 2: For testing, paste your benchmark code here
      // Make sure Askr is available (either bundled or via CDN/npm)

      console.log(
        'Benchmark HTML loaded. Import your Askr benchmark bundle here.'
      );
      console.log('Expected: createIsland({ root: "main", component: App })');
    </script>
  </body>
</html>
